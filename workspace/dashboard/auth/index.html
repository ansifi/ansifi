<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{BRAND}} — sign in</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/dashboard.css?v=20260921p">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <p class="login-mark">{{MARK}}</p>
      <h2 id="login-title">{{BRAND}}</h2>
      <form id="empever-login-form" autocomplete="on">
        <label>
          <span>Username or email</span>
          <input id="empever-user" name="username" type="text" required autocomplete="username">
        </label>
        <label>
          <span>Password</span>
          <input id="empever-pass" name="password" type="password" required autocomplete="current-password">
        </label>
        <p id="empever-login-error" class="login-error" hidden></p>
        <button type="submit" class="login-submit" id="empever-login-submit">Sign in</button>
      </form>
    </section>
  </main>
  <script src="/auth/login.js?v=20260930c"></script>
  <script src="/presence.js"></script>
</body>
</html>
