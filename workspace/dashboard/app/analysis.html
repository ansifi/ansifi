<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis — Works</title>
  <link rel="stylesheet" href="/app/works.css">
</head>
<body data-page="analysis">
  <header class="top">
    <a class="brand" href="/app/"><span class="mark">A</span> Works</a>
    <nav class="desks">
      <a href="/app/">Home</a>
      <a class="is-on" href="/app/analysis.html">Analysis</a>
      <a href="/app/content.html">Content</a>
      <a href="/app/network.html">Network</a>
      <a href="/app/operate.html">Operate</a>
    </nav>
  </header>
  <p class="next" id="how">Ask about a work, then save a note into 02_Content/Notes (no project names in the public copy).</p>
  <div class="chips" id="work-chips"></div>
  <section>
    <h2>Chat</h2>
    <div class="log" id="chat-log"></div>
    <form class="row" id="chat-form">
      <textarea id="chat-input" rows="2" placeholder="Ask about this work…"></textarea>
      <button type="submit" class="lane is-on">Ask</button>
    </form>
  </section>
  <section>
    <h2>Save a note</h2>
    <p class="blurb">Stored in 02_Content/Notes/. Content app lists it for a manual post.</p>
    <form id="note-form">
      <input id="note-title" type="text" placeholder="Note title">
      <textarea id="note-body" rows="5" placeholder="Pain, 7.x neighbor, trap — no hosts or mailboxes."></textarea>
      <button type="submit" class="lane is-on">Save to Content</button>
      <p class="host" id="note-status"></p>
    </form>
  </section>
  <script src="/app/nav.js"></script>
  <script src="/app/desk.js"></script>
</body>
</html>
