plugins {
    id "com.android.application"
}

android {
    namespace "com.ansif.workspace"
    compileSdk 35

    defaultConfig {
        applicationId "com.ansif.workspace"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
